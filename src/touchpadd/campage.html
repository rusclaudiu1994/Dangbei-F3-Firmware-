<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camera Levi</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}img{width:100vw;height:100vh;object-fit:contain;display:block}#m{position:fixed;left:0;right:0;top:45%;text-align:center;color:#888;font:20px sans-serif}</style></head>
<body><div id="m">se conectează la camera lui Levi...</div><img id="i" alt="">
<script>const i=document.getElementById('i'),m=document.getElementById('m');let t;
function go(){m.style.display='block';i.src='/cam.mjpg?'+Date.now();}
i.onload=()=>{m.style.display='none';};i.onerror=()=>{m.textContent='fără imagine, reîncerc...';clearTimeout(t);t=setTimeout(go,3000);};
go();setInterval(()=>{if(i.naturalWidth===0)go();},15000);
document.addEventListener('click',()=>{const d=document.documentElement;(d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d);});
</script></body></html>
